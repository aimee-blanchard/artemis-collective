<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inquire · The Artemis Collective</title>
<meta name="description" content="Start a project with The Artemis Collective.">
<meta name="theme-color" content="#eceae0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><img src="images/logo-soot.png" alt="The Artemis Collective — home"></a>
  <nav class="caps" aria-label="Main">
    <a href="services.html">Services</a>
    <a href="inquire.html" aria-current="page">Inquire</a>
  </nav>
</header>

<main>
  <section class="intro">
    <h1>Start a project</h1>
    <hr class="rule">
    <p>Tell us a little about your space, and we’ll be in touch.</p>
  </section>

  <!--
    Submissions go to Formspree, which emails you and keeps every inquiry in its dashboard.
    SETUP: replace YOUR_FORM_ID below with the ID from your Formspree form (see README.md).
  -->
  <form class="inquiry" id="inquiry" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <input type="hidden" name="_subject" value="New inquiry — The Artemis Collective">
    <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="field"><label class="caps" for="first">First name</label><input id="first" name="first_name" autocomplete="given-name"></div>
    <div class="field"><label class="caps" for="last">Last name</label><input id="last" name="last_name" autocomplete="family-name"></div>
    <div class="field"><label class="caps" for="email">Email <span class="req">*</span></label><input id="email" name="email" type="email" required autocomplete="email"></div>
    <div class="field"><label class="caps" for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>

    <div class="field full"><label class="caps" for="address">Project address</label><input id="address" name="project_address" autocomplete="street-address"></div>
    <div class="field"><label class="caps" for="city">City</label><input id="city" name="city" autocomplete="address-level2"></div>
    <div class="field"><label class="caps" for="state">State</label><input id="state" name="state" autocomplete="address-level1"></div>

    <div class="field"><label class="caps" for="type">Type of project</label>
      <select id="type" name="project_type">
        <option value="">Select</option>
        <option>Drafting</option>
        <option>Remodel</option>
        <option>New Construction</option>
        <option>Furnishing</option>
        <option>Not sure yet</option>
      </select>
    </div>
    <div class="field"><label class="caps" for="budget">Estimated budget</label>
      <select id="budget" name="budget">
        <option value="">Select</option>
        <option>Under $25k</option>
        <option>$25k – $75k</option>
        <option>$75k – $150k</option>
        <option>$150k – $300k</option>
        <option>$300k+</option>
      </select>
    </div>
    <div class="field full"><label class="caps" for="date">Ideal start date</label><input id="date" name="desired_start" type="date"></div>

    <div class="field full"><label class="caps" for="msg">Tell us about your project <span class="req">*</span></label><textarea id="msg" name="message" required></textarea></div>
    <div class="field full"><label class="caps" for="heard">How did you hear about us?</label><input id="heard" name="referral"></div>

    <p class="form-status" id="status" role="status"></p>
    <div class="form-actions"><button class="btn caps" type="submit">Submit inquiry</button></div>
  </form>

  <p class="thanks" id="thanks" hidden>Thank you — your inquiry is on its way. We’ll be in touch soon.</p>
</main>

<footer class="site-footer">
  <img src="images/logo-ivory.png" alt="The Artemis Collective">
  <nav class="caps" aria-label="Footer">
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="inquire.html">Inquire</a>
  </nav>
  <small>© <span class="yr">2026</span> The Artemis Collective</small>
</footer>

<script>
document.querySelectorAll('.yr').forEach(function (e) { e.textContent = new Date().getFullYear(); });

// Send the form in the background so the visitor stays on the page and sees a thank-you.
// Without JavaScript the form still posts normally to Formspree.
(function () {
  var form = document.getElementById('inquiry');
  var status = document.getElementById('status');
  var btn = form.querySelector('button');
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (form.action.indexOf('YOUR_FORM_ID') !== -1) {
      status.textContent = 'This form isn’t connected yet — add the Formspree form ID.';
      return;
    }
    btn.disabled = true;
    status.textContent = 'Sending…';
    fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error();
        form.hidden = true;
        document.getElementById('thanks').hidden = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(function () {
        status.textContent = 'Something went wrong. Please try again in a moment.';
        btn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
